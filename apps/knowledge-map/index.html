<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#030610" />
  <title>Knowledge Map</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 id="map-title">Knowledge Map</h1>
    <div class="search-wrap">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
      <input id="search" type="search" aria-label="Search your knowledge" placeholder="Search your knowledge…" autocomplete="off" />
      <kbd>/</kbd>
    </div>
    <button id="reset-view" class="quiet-button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/></svg><span>Reset view</span></button>
    <button id="toggle-sources" class="quiet-button" aria-expanded="false" aria-controls="sidebar">Sources</button>
  </header>
  <main>
    <aside id="sidebar">
      <div class="intro">
        <h2>Your knowledge.<br><span>In a new dimension.</span></h2>
        <p>Explore the connections behind your ideas.</p>
        <div id="inventory" class="inventory" aria-live="polite">Loading your knowledge…</div>
      </div>
      <section class="sources-panel" aria-label="Source filters">
        <h3>Sources</h3>
        <div id="filters"></div>
        <label class="label-option"><input id="show-labels" type="checkbox" /> Show all labels</label>
        <button id="browse-notes" class="browse-button" aria-expanded="false" aria-controls="note-list">Browse notes <span aria-hidden="true">↗</span></button>
        <div id="note-list" hidden></div>
      </section>
    </aside>
    <section id="canvas-wrap" aria-label="Interactive knowledge map">
      <canvas id="graph" tabindex="0" aria-label="3D knowledge graph. Drag or use arrow keys to orbit. Scroll or use plus and minus to zoom. Use Browse notes to select a note with the keyboard."></canvas>
      <div id="view-status" role="status">Loading…</div>
      <div id="empty-state" hidden><h2>No notes in view</h2><p>Try another search or enable a source.</p><button id="clear-filters">Clear filters</button></div>
      <div class="view-controls" aria-label="Map controls">
        <button id="auto-rotate" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></svg><span>Auto-rotate</span></button>
        <span class="divider"></span>
        <button id="zoom-out" aria-label="Zoom out"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button id="zoom-in" aria-label="Zoom in"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
        <span class="divider"></span>
        <button id="cinema" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg><span>Cinema</span></button>
      </div>
      <footer><span>Drag to orbit · Scroll to zoom · Click to read</span><span>LOCAL / 3D</span></footer>
    </section>
    <aside id="reader" aria-labelledby="note-title" hidden>
      <div class="reader-head"><span id="note-source"></span><button id="close-reader" aria-label="Close reader">×</button></div>
      <h2 id="note-title" tabindex="-1"></h2>
      <div id="note-meta"></div>
      <div class="reader-mode" role="group" aria-label="Note display">
        <button id="view-formatted" aria-pressed="true" aria-controls="note-formatted">Formatted</button>
        <button id="view-markdown" aria-pressed="false" aria-controls="note-content">Markdown</button>
      </div>
      <article id="note-formatted" class="formatted-note" aria-label="Formatted note"></article>
      <pre id="note-content" aria-label="Markdown source" hidden></pre>
      <section id="connections"><h3>Connected notes</h3><div id="connected-notes"></div></section>
    </aside>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
